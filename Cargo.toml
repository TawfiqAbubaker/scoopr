[package]
name = "scoopr"
version = "0.1.0"
edition = "2021"
description = "Scoop text from a Herdr pane"
license = "MIT"
readme = "README.md"
keywords = ["herdr", "terminal", "fuzzy-finder", "clipboard"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.28"
norm = { version = "0.1.1", features = ["fzf-v2"] }
serde_json = "1"
